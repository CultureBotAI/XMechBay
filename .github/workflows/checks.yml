name: Infrastructure checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated tests
        run: |
          python3 -m pip install -r requirements-excel.txt
          python3 -B -m unittest discover -s tests -v
      - name: Verify skill mirrors
        run: python3 scripts/sync_skill_mirrors.py --check
      - name: Check shell syntax
        run: bash -n .agents/skills/mac-orchestration/scripts/mac-term.sh
      - name: Check publishable content and history
        run: python3 scripts/check_public_content.py
